# Render Blueprint � deploy Yojana Saarthi on Render's free tier
services:
  - type: web
    name: yojana-sarthi
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend --include=dev && npm ci --prefix backend --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
