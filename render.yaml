# Render Blueprint - deploy Yojana Saarthi on Render's free tier
services:
  - type: web
    name: yojana-sarthi
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend --include=dev && npm ci --prefix backend --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: PORT
        value: 3000
      # Public URL used in password-reset / email-verification links.
      - key: APP_URL
        value: https://yojana-sarthi-t9bc.onrender.com
      # Set this to a verified Resend sender/domain in production.
      - key: MAIL_FROM
        value: Yojana Saarthi <onboarding@resend.dev>
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
